name: unitTest

# On push and PR: the PR's submodules. Nightly: the same test with
# AMReX-Hydro, PelePhysics and PelePhysics' AMReX moved to their development
# branches.
on:
  workflow_dispatch:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-${{ github.event_name }}-unitTest
  cancel-in-progress: true

jobs:
  # Build the RegTests/UnitTest
  UT_FS:
    name: UnitTest_FS
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
          submodules: recursive
    - name: System Dependencies
      run: .github/workflows/dependencies/dependencies_mpi.sh
    - name: LMeX Reference
      run: |
          git clone --depth 1 --recursive --single-branch --shallow-submodules -b development https://github.com/Pele-Suite/PeleLMeX.git buildRef/PeleLMeX
    - name: Build Reference PeleLMeX
      working-directory: ${{github.workspace}}/buildRef/PeleLMeX/Exec/UnitTests/DodecaneLu
      run: |
          make -j $(nproc) TPL COMP=gnu DEBUG=FALSE
          make -j $(nproc) COMP=gnu DEBUG=FALSE
    - name: Run Reference Case
      working-directory: ${{github.workspace}}/buildRef/PeleLMeX/Exec/UnitTests/DodecaneLu
      run: |
          ./PeleLMeX3d.gnu.MPI.ex inputs.3d
    - name: Update PeleLMeX Submodules
      if: github.event_name == 'schedule'
      run: |
          git -C Submodules/AMReX-Hydro checkout development
          git -C Submodules/PelePhysics checkout development
          git -C Submodules/PelePhysics/Submodules/amrex checkout development
    - name: Build AMReX Tools
      working-directory: ${{github.workspace}}/Submodules/PelePhysics/Submodules/amrex/Tools/Plotfile
      run: |
          make -j $(nproc) VERBOSE=FALSE programs=fcompare
    - name: Build PeleLMeX
      working-directory: ${{github.workspace}}/Exec/UnitTests/DodecaneLu
      run: |
          make -j $(nproc) TPL COMP=gnu DEBUG=FALSE
          make -j $(nproc) COMP=gnu DEBUG=FALSE
    - name: Run Case
      working-directory: ${{github.workspace}}/Exec/UnitTests/DodecaneLu
      run: |
          cp ${{github.workspace}}/Submodules/PelePhysics/Submodules/amrex/Tools/Plotfile/fcompare.gnu.ex .
          ./PeleLMeX3d.gnu.MPI.ex inputs.3d
          ./fcompare.gnu.ex --abort_if_not_all_found pltEvaluate ${{github.workspace}}/buildRef/PeleLMeX/Exec/UnitTests/DodecaneLu/pltEvaluate
