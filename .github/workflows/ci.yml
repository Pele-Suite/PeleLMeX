name: PeleLMeX-CI

on:
  workflow_dispatch:
  schedule:
    # Twice a week, so the ccaches are refreshed before GitHub evicts them
    # after 7 days without access, with a margin for late scheduled starts.
    # Jobs without a cache (CodeQL, codespell) skip the scheduled runs.
    - cron: '0 3 * * 1,4'
  push:
    branches: [development]
  pull_request:
    branches: [development]

concurrency:
  # Only PR runs cancel an older run: on development a cancelled run would
  # not save its caches, so runs queue, one at a time (GitHub keeps only the
  # newest pending one). The scheduled runs have their own group: in the
  # pushes' group one would replace a pending push run, whose commit would
  # then never be tested (the scheduled runs skip the tests).
  group: ${{github.ref}}-${{github.head_ref}}-ci${{github.event_name == 'schedule' && '-schedule' || ''}}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

# Run steps with bash -eo pipefail, so `build | tee log` fails with the build.
defaults:
  run:
    shell: bash

env:
  # Only development saves the ccaches (the scheduled runs keep them from
  # being evicted); PRs restore development's. A PR's own runs would each
  # store a full copy and push development's out of the 10 GB limit.
  SAVE_CCACHE: ${{github.ref == 'refs/heads/development'}}
  # Compress hard only when the cache is kept; a PR's new entries are
  # discarded at the end of the job.
  CCACHE_COMPRESSLEVEL: ${{github.ref == 'refs/heads/development' && 10 || 1}}
  # The scheduled runs only refresh the ccaches: they build (which also
  # trims the caches to what is used) but skip the tests, which already
  # ran on this commit.
  RUN_TESTS: ${{github.event_name != 'schedule'}}
  # The ccache directory the cache steps save and restore (ccache's default
  # on Linux; CPU-CMake sets its own per OS).
  COMPILER_CACHE_DIR: ~/.cache/ccache
  # SUNDIALS writes its configure time into sundials_config.h (SUN_JOB_ID,
  # SUN_JOB_START_TIME) unless these are set, which changes the ccache and
  # ctcache keys of every file including it on every run: clang-tidy's -dD
  # puts the #defines in the hashed preprocessed source, and GPU-SYCL's
  # CCACHE_DEPEND hashes the header itself. Non-zero: SUNDIALS tests them
  # with if($ENV{...}), and 0 is false.
  CI_JOB_ID: 1
  CI_JOB_STARTED_AT: 1

jobs:
  Formatting:
    runs-on: ubuntu-latest
    steps:
    - name: Clone
      uses: actions/checkout@v6
    - name: Check formatting
      uses: DoozyX/clang-format-lint-action@v0.20
      with:
        source: './Source ./Exec'
        exclude: '.'
        extensions: 'H,h,cpp'
        clangFormatVersion: 20
  CPU-GNUmake:
    needs: Formatting
    runs-on: ubuntu-24.04
    env:
      # One cold FlameSheet build plus the SUNDIALS TPL fills ~95M; ccache
      # evicts per subdirectory before the total reaches the limit.
      CCACHE_MAXSIZE: 250M
      CACHE_KEY: ccache-${{github.workflow}}-${{github.job}}
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup
        run: echo "NPROCS=$(nproc)" >> $GITHUB_ENV
      # Records the start of the run for Trim Ccache and installs ccache: AMReX's
      # script on Linux (macOS gets it from brew in Dependencies), run outside
      # the checkout since it downloads into the current directory. Defined
      # once here and reused (*install_ccache) by the other jobs.
      - &install_ccache
        name: Install Ccache
        working-directory: ${{runner.temp}}
        run: |
          # The time itself, not a marker file: reading a file's time back
          # (date -r FILE) is a GNU extension older macOS date lacks.
          echo "COMPILER_CACHE_START=$(date +%s)" >> $GITHUB_ENV
          # Paths under the workspace are hashed relative to the compile's
          # directory, so a build directory's name (e.g. the reference
          # build's) does not stop it hitting another's entries. Set here as
          # the runner context is not available in env:.
          echo "CCACHE_BASEDIR=${{runner.workspace}}" >> $GITHUB_ENV
          # Every CMake configure after this, the TPLs' (SUNDIALS) included,
          # compiles through ccache: CMake reads these as the default launchers.
          for lang in C CXX CUDA; do
            echo "CMAKE_${lang}_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
          done
          if [ "${RUNNER_OS}" = Linux ]; then
            ${{github.workspace}}/Submodules/PelePhysics/Submodules/amrex/.github/workflows/dependencies/dependencies_ccache.sh
          fi
      # Restore only; the cache is saved at the end of the job, and only from
      # development (SAVE_CCACHE). Reused (*restore_ccache) by the other build
      # jobs, which each set CACHE_KEY.
      - &restore_ccache
        name: Set Up Ccache
        id: ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{env.COMPILER_CACHE_DIR}}
          key: ${{env.CACHE_KEY}}-git-${{github.sha}}-${{github.run_id}}-${{github.run_attempt}}
          restore-keys: |
               ${{env.CACHE_KEY}}-git-
      - name: TPL
        working-directory: ./Exec/RegTests/FlameSheet
        run: make COMP=gnu USE_MPI=FALSE DEBUG=TRUE TPL
      - name: FlameSheet debug make
        working-directory: ./Exec/RegTests/FlameSheet
        run: |
          ccache -z
          make -j ${{env.NPROCS}} DIM=2 KEEP_BUILDINFO_CPP=TRUE USE_CCACHE=TRUE COMP=gnu USE_MPI=FALSE DEBUG=TRUE 2>&1 | tee -a build-output.txt
      - name: FlameSheet ccache report
        run: ccache -s
      - name: FlameSheet debug test
        if: env.RUN_TESTS == 'true'
        working-directory: ./Exec/RegTests/FlameSheet
        run: ./PeleLMeX2d.gnu.DEBUG.drm19.ex flamesheet-drm19-2d.inp amr.max_step=1 amr.plot_int=-1 amr.check_int=-1
      - name: FlameSheet debug report
        working-directory: ./Exec/RegTests/FlameSheet
        run: ${{github.workspace}}/.github/scripts/count_warnings.sh build-output.txt "GNUmakefile|ThirdParty"
      # Drop the entries this run did not use (hits refresh an entry's mtime),
      # so the saved cache is the current working set; only after a successful
      # job (the default condition), since a failed one never reached some
      # files. Reused (*trim_ccache, *save_ccache) by the other build jobs.
      # COMPILER_CACHE_DIR and CACHE_KEY are not CCACHE_* names on purpose:
      # ccache reads those (CCACHE_PATH is where it looks for the compiler).
      - &trim_ccache
        name: Trim Ccache
        if: env.SAVE_CCACHE == 'true'
        run: |
          # Fails the step if Install Ccache did not record the start, rather
          # than silently trimming nothing.
          start=${COMPILER_CACHE_START:?not set by Install Ccache}
          ccache --evict-older-than $(( $(date +%s) - start + 60 ))s
          ccache -s
      - &save_ccache
        name: Save Ccache
        if: env.SAVE_CCACHE == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{env.COMPILER_CACHE_DIR}}
          key: ${{steps.ccache.outputs.cache-primary-key}}
  CPU-CMake:
    needs: Formatting
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        build_type: [Release, Debug]
        enable_eb: [EB-OFF, EB-ON]
        dim: [2, 3]
        include:
          - os: macos-latest
            procs: $(sysctl -n hw.ncpu)
            ccache_cache: /Users/runner/Library/Caches/ccache
            reference_comparison: ON
          - os: ubuntu-24.04
            procs: $(nproc)
            ccache_cache: ~/.cache/ccache
            reference_comparison: OFF
          - build_type: Release
            ccache_size: 250M
          # A cold Debug build (-g) overflows 500M; Trim Ccache keeps the
          # saved cache to one build's worth, not the limit.
          - build_type: Debug
            ccache_size: 1G
          - enable_eb: EB-OFF
            use_eb: "OFF"
          - enable_eb: EB-ON
            use_eb: "ON"
        exclude:
          - os: macos-latest
            build_type: Debug
    env:
      # Compare with development, except on development itself.
      DO_REF_COMPARE: ${{matrix.reference_comparison == 'ON' && github.ref != 'refs/heads/development'}}
      CCACHE_MAXSIZE: ${{matrix.ccache_size}}
      COMPILER_CACHE_DIR: ${{matrix.ccache_cache}}
      CACHE_KEY: ccache-${{github.workflow}}-${{github.job}}-${{matrix.os}}-${{matrix.dim}}d-${{matrix.build_type}}-${{matrix.enable_eb}}
      CTEST_ARGS: -LE no-ci
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: recursive
      # Before setup-python: the script deletes the hosted tool cache, where
      # setup-python installs Python.
      - name: Free Disk Space
        if: runner.os == 'Linux'
        run: ${{github.workspace}}/Submodules/PelePhysics/Submodules/amrex/.github/workflows/dependencies/ubuntu_free_disk_space.sh
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Setup
        run: |
          echo "NPROCS=${{matrix.procs}}" >> $GITHUB_ENV
      - name: Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          ${{github.workspace}}/.github/workflows/dependencies/dependencies_mpi.sh
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install open-mpi automake ccache
      - name: Python packages
        # Only the tests use them.
        if: env.RUN_TESTS == 'true'
        run: pip install pynose numpy pandas
      - *install_ccache
      - *restore_ccache
      - name: Configure
        run: |
          cmake -B${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-${{matrix.enable_eb}} \
          -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/install-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-${{matrix.enable_eb}} \
          -DCMAKE_BUILD_TYPE:STRING=${{matrix.build_type}} \
          -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON \
          -DPELE_DIM:STRING=${{matrix.dim}} \
          -DPELE_ENABLE_MPI:BOOL=ON \
          -DMPIEXEC_PREFLAGS:STRING=--oversubscribe \
          -DPELE_ENABLE_EB:BOOL=${{matrix.use_eb}} \
          -DPELE_ENABLE_FCOMPARE_FOR_TESTS:BOOL=OFF \
          -DPELE_SAVE_GOLDS:BOOL=${{matrix.reference_comparison}} \
          -DPELE_SAVED_GOLDS_DIRECTORY=${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-${{matrix.enable_eb}} \
          ${{github.workspace}}
      - name: Build
        run: |
          ccache -z
          cmake --build ${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-${{matrix.enable_eb}} \
            --parallel ${{env.NPROCS}} 2>&1 | tee -a ${{runner.workspace}}/build-output.txt
      - name: Ccache Report
        run: ccache -s
      - name: Report
        run: .github/scripts/count_warnings.sh ${{runner.workspace}}/build-output.txt
      - name: Test
        if: env.RUN_TESTS == 'true'
        working-directory: ${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-${{matrix.enable_eb}}
        run: ctest ${CTEST_ARGS} -VV --output-on-failure
      - name: Checkout Reference Version
        if: env.DO_REF_COMPARE == 'true'
        run : |
          # Development is checked out over this work tree, so the reference
          # build sits next to it exactly as development's own build does and,
          # with CCACHE_BASEDIR, hits development's cache entries. Keep the
          # target helper, which development may not have.
          cp ${{github.workspace}}/.github/scripts/ctest_targets.py ${{runner.temp}}/
          git remote add amrexcomb https://github.com/Pele-Suite/PeleLMeX.git
          git fetch amrexcomb development --depth=1
          git checkout amrexcomb/development
          git submodule update --recursive --depth=1
      - name: Configure Reference
        if: env.DO_REF_COMPARE == 'true'
        run: |
          # CMake File API query: the configure writes the codemodel that
          # ctest_targets.py reads to map test commands to targets.
          QUERY=${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-${{matrix.enable_eb}}-reference/.cmake/api/v1/query
          mkdir -p ${QUERY}
          touch ${QUERY}/codemodel-v2
          cmake -B${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-${{matrix.enable_eb}}-reference \
          -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/install-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-${{matrix.enable_eb}}-reference \
          -DCMAKE_BUILD_TYPE:STRING=${{matrix.build_type}} \
          -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON \
          -DPELE_DIM:STRING=${{matrix.dim}} \
          -DPELE_ENABLE_MPI:BOOL=ON \
          -DMPIEXEC_PREFLAGS:STRING=--oversubscribe \
          -DPELE_ENABLE_FCOMPARE:BOOL=ON \
          -DPELE_ENABLE_FCOMPARE_FOR_TESTS:BOOL=ON \
          -DPELE_REFERENCE_GOLDS_DIRECTORY:STRING=${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-${{matrix.enable_eb}}  \
          -DPELE_ENABLE_EB:BOOL=${{matrix.use_eb}} \
          ${{github.workspace}}
      - name: Build Reference Version
        if: env.DO_REF_COMPARE == 'true'
        run : |
          ccache -z
          # The reference build only produces plotfiles for the comparison:
          # build just the executables its tests run.
          BUILD_DIR=${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-${{matrix.enable_eb}}-reference
          TARGETS=$(python3 ${{runner.temp}}/ctest_targets.py ${BUILD_DIR} ${CTEST_ARGS}) \
            || { echo "::warning::could not list the test targets, building all"; TARGETS=""; }
          echo "Building: ${TARGETS:-all targets}"
          cmake --build ${BUILD_DIR} --parallel ${{env.NPROCS}} ${TARGETS:+--target ${TARGETS}}
          ccache -s
      - name: Test Reference and Compare
        if: env.DO_REF_COMPARE == 'true'
        working-directory: ${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-${{matrix.enable_eb}}-reference
        run : |
          ctest ${CTEST_ARGS} -VV --output-on-failure
      - *trim_ccache
      - *save_ccache
  CPU-CMake-Hypre:
    # AMReX's composite (all AMR levels) hypre/AlgMG solvers: PeleLMeX built
    # with hypre, with and without EB, running the regression tests that
    # need it
    needs: Formatting
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - enable_eb: EB-OFF
            use_eb: "OFF"
            targets: "PeleLMeX-FlameSheet"
          - enable_eb: EB-ON
            use_eb: "ON"
            targets: "PeleLMeX-EB_FlowPastCylinder PeleLMeX-EB_BackwardStepFlame"
    env:
      HYPRE_VERSION: 2.32.0
      CCACHE_MAXSIZE: 250M
      CACHE_KEY: ccache-${{github.workflow}}-${{github.job}}-${{matrix.enable_eb}}
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup
        run: |
          echo "NPROCS=$(nproc)" >> $GITHUB_ENV
          echo "HYPRE_INSTALL=${{runner.workspace}}/hypre-install-${HYPRE_VERSION}" >> $GITHUB_ENV
      - name: Dependencies
        run: ${{github.workspace}}/.github/workflows/dependencies/dependencies_mpi.sh
      - *install_ccache
      - *restore_ccache
      - name: Cache Hypre
        id: cache-hypre
        uses: actions/cache@v5
        with:
          path: ${{env.HYPRE_INSTALL}}
          key: hypre-${{env.HYPRE_VERSION}}-${{runner.os}}-openmpi
      - name: Build Hypre
        if: steps.cache-hypre.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/hypre-space/hypre/archive/refs/tags/v${HYPRE_VERSION}.tar.gz
          tar xfz v${HYPRE_VERSION}.tar.gz
          cd hypre-${HYPRE_VERSION}/src
          # hypre's C sources typedef bool: keep C17 for compilers defaulting to C23
          ./configure --prefix=${HYPRE_INSTALL} --with-cxxstandard=17 CFLAGS="-O2 -std=gnu17"
          make -j ${{env.NPROCS}}
          make install
      - name: Configure
        run: |
          cmake -B${{runner.workspace}}/build-hypre \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON \
          -DPELE_DIM:STRING=2 \
          -DPELE_ENABLE_MPI:BOOL=ON \
          -DMPIEXEC_PREFLAGS:STRING=--oversubscribe \
          -DPELE_ENABLE_HYPRE:BOOL=ON \
          -DPELE_ENABLE_EB:BOOL=${{matrix.use_eb}} \
          -DHYPRE_ROOT:PATH=${HYPRE_INSTALL} \
          -DCMAKE_PREFIX_PATH:PATH=${HYPRE_INSTALL} \
          -DPELE_ENABLE_FCOMPARE_FOR_TESTS:BOOL=OFF \
          ${{github.workspace}}
      - name: Build
        run: |
          ccache -z
          cmake --build ${{runner.workspace}}/build-hypre --target ${{matrix.targets}} \
            --parallel ${{env.NPROCS}}
          ccache -s
      - name: Test
        if: env.RUN_TESTS == 'true'
        run: |
          cd ${{runner.workspace}}/build-hypre
          ctest -R composite -VV --output-on-failure
      - *trim_ccache
      - *save_ccache
  CPU-CMake-SINGLE:
    needs: Formatting
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        enable_eb: [EB-OFF, EB-ON]
        dim: [2, 3]
        include:
          - enable_eb: EB-OFF
            use_eb: "OFF"
          - enable_eb: EB-ON
            use_eb: "ON"
    env:
      CCACHE_MAXSIZE: 250M
      CACHE_KEY: ccache-${{github.workflow}}-${{github.job}}-${{matrix.dim}}d-${{matrix.enable_eb}}-single
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup
        run: |
          echo "NPROCS=$(nproc)" >> $GITHUB_ENV
      - name: Dependencies
        run: ${{github.workspace}}/.github/workflows/dependencies/dependencies_mpi.sh
      - *install_ccache
      - *restore_ccache
      - name: Configure
        run: |
          cmake -B${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.enable_eb}}-single \
          -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/install-${{matrix.dim}}d-${{matrix.enable_eb}}-single \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON \
          -DPELE_DIM:STRING=${{matrix.dim}} \
          -DPELE_PRECISION:STRING=SINGLE \
          -DCMAKE_CXX_FLAGS:STRING=-Wno-float-conversion \
          -DPELE_ENABLE_MPI:BOOL=ON \
          -DMPIEXEC_PREFLAGS:STRING=--oversubscribe \
          -DPELE_ENABLE_EB:BOOL=${{matrix.use_eb}} \
          -DPELE_ENABLE_FCOMPARE_FOR_TESTS:BOOL=OFF \
          ${{github.workspace}}
      - name: Build
        run: |
          ccache -z
          cmake --build ${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.enable_eb}}-single \
            --parallel ${{env.NPROCS}} 2>&1 | tee -a ${{runner.workspace}}/build-output.txt
      - name: Ccache Report
        run: ccache -s
      - name: Report
        run: .github/scripts/count_warnings.sh ${{runner.workspace}}/build-output.txt
      - *trim_ccache
      - *save_ccache

  GPU-Nvidia:
    name: GPU-CUDA
    needs: [Formatting, CPU-GNUmake]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        enable_eb: [EB-OFF, EB-ON]
        include:
          - enable_eb: EB-OFF
            use_eb: "OFF"
          - enable_eb: EB-ON
            use_eb: "ON"
      fail-fast: false
    env:
      # A cold build overflows 300M (EB-OFF and EB-ON)
      CCACHE_MAXSIZE: 600M
      CACHE_KEY: ccache-${{github.workflow}}-${{github.job}}-${{matrix.enable_eb}}
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup
        run: |
          echo "NPROCS=$(nproc)" >> $GITHUB_ENV
      - name: Dependencies
        run: |
          ${{github.workspace}}/Submodules/PelePhysics/Submodules/amrex/.github/workflows/dependencies/ubuntu_free_disk_space.sh
          ${{github.workspace}}/Submodules/PelePhysics/.github/workflows/dependencies/dependencies_cuda.sh
      - *install_ccache
      - *restore_ccache
      - name: Configure
        run: |
          # /usr/local/cuda points at whichever version dependencies_cuda.sh installed.
          export PATH=/usr/local/nvidia/bin:/usr/local/cuda/bin:${PATH}
          export LD_LIBRARY_PATH=/usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64:${LD_LIBRARY_PATH}
          cmake -Bbuild-cuda \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON \
            -DPELE_ENABLE_MPI:BOOL=OFF \
            -DPELE_ENABLE_CUDA:BOOL=ON \
            -DPELE_ENABLE_EB:BOOL=${{matrix.use_eb}} \
            -DAMReX_CUDA_ERROR_CAPTURE_THIS:BOOL=ON \
            -DCMAKE_CUDA_ARCHITECTURES:STRING=80 \
            ${{github.workspace}}
      - name: Build
        run: |
          ccache -z
          cmake --build build-cuda --parallel ${{env.NPROCS}}
      - name: Ccache Report
        run: ccache -s
      - *trim_ccache
      - *save_ccache
  GPU-AMD:
    name: GPU-HIP
    needs: [Formatting, CPU-GNUmake]
    runs-on: ubuntu-24.04
    env:
      CCACHE_MAXSIZE: 200M
      CACHE_KEY: ccache-${{github.workflow}}-${{github.job}}
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup
        run: |
          echo "NPROCS=$(nproc)" >> $GITHUB_ENV
      - name: Dependencies
        run: |
          ${{github.workspace}}/Submodules/PelePhysics/Submodules/amrex/.github/workflows/dependencies/ubuntu_free_disk_space.sh
          sudo mkdir --parents --mode=0755 /etc/apt/keyrings
          wget https://repo.radeon.com/rocm/rocm.gpg.key -O - | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.3.3 noble main" | sudo tee --append /etc/apt/sources.list.d/rocm.list
          echo -e 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600' | sudo tee /etc/apt/preferences.d/rocm-pin-600
          echo 'export PATH=/opt/rocm/llvm/bin:/opt/rocm/bin:/opt/rocm/profiler/bin:/opt/rocm/opencl/bin:$PATH' | sudo tee -a /etc/profile.d/rocm.sh
          sudo apt-get update
          sudo apt-get install -y rocm-dev rocrand-dev rocprim-dev hiprand-dev rocsparse-dev
      - *install_ccache
      - *restore_ccache
      - name: Configure
        run: |
          source /etc/profile.d/rocm.sh
          hipcc --version
          cmake -B${{runner.workspace}}/build-hip \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON \
          -DCMAKE_CXX_COMPILER:STRING=$(which clang++) \
          -DCMAKE_C_COMPILER:STRING=$(which clang) \
          -DPELE_ENABLE_MPI:BOOL=OFF \
          -DPELE_ENABLE_HIP:BOOL=ON \
          -DAMReX_AMD_ARCH:STRING=gfx90a \
          -DCMAKE_HIP_ARCHITECTURES:STRING=gfx90a \
          -DAMDGPU_TARGETS:STRING=gfx90a \
          -DGPU_TARGETS:STRING=gfx90a \
          -DAMReX_GPU_RDC:BOOL=OFF \
          -DPELE_ENABLE_FCOMPARE_FOR_TESTS:BOOL=OFF \
          ${{github.workspace}}
      - name: Build
        run: |
          source /etc/profile.d/rocm.sh
          ccache -z
          cmake --build ${{runner.workspace}}/build-hip --parallel ${{env.NPROCS}}
      - name: Ccache Report
        run: ccache -s
      - *trim_ccache
      - *save_ccache
  GPU-Intel:
    name: GPU-SYCL
    needs: [Formatting, CPU-GNUmake]
    runs-on: ubuntu-24.04
    env:
      CCACHE_MAXSIZE: 200M
      CCACHE_DEPEND: 1
      CACHE_KEY: ccache-${{github.workflow}}-${{github.job}}
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup
        run: |
          echo "NPROCS=$(nproc)" >> $GITHUB_ENV
      - name: Dependencies
        run: |
          ${{github.workspace}}/Submodules/PelePhysics/Submodules/amrex/.github/workflows/dependencies/ubuntu_free_disk_space.sh
          sudo wget https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          sudo apt-key add GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          echo "deb https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl-devel
      - *install_ccache
      - *restore_ccache
      - name: Configure
        run: |
          set +e
          source /opt/intel/oneapi/setvars.sh
          set -e
          cmake -B${{runner.workspace}}/build-sycl \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON \
            -DCMAKE_CXX_COMPILER:STRING=$(which icpx) \
            -DCMAKE_C_COMPILER:STRING=$(which icx) \
            -DCMAKE_CXX_FLAGS:STRING=-fsycl \
            -DPELE_ENABLE_MPI:BOOL=OFF \
            -DPELE_ENABLE_FCOMPARE_FOR_TESTS:BOOL=OFF \
            -DPELE_ENABLE_SYCL:BOOL=ON \
            ${{github.workspace}}
      - name: Build
        run: |
          set +e
          source /opt/intel/oneapi/setvars.sh
          set -e
          ccache -z
          cmake --build ${{runner.workspace}}/build-sycl --parallel ${{env.NPROCS}}
      - name: Ccache Report
        run: ccache -s
      - *trim_ccache
      - *save_ccache
  Lint-clang-tidy:
    needs: Formatting
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        enable_eb: [EB-OFF, EB-ON]
        include:
          - enable_eb: EB-OFF
            use_eb: "OFF"
          - enable_eb: EB-ON
            use_eb: "ON"
      fail-fast: false
    env:
      # Room for a whole build, with headroom: a cold build overflows 100M,
      # and ccache evicts per subdirectory before the total reaches the
      # limit. Check trims the cache to what the run used, so the saved
      # cache is one build's worth, not the limit.
      CCACHE_MAXSIZE: 500M
      # Unlike the build jobs, this cache is saved on PRs too: a cold
      # clang-tidy run takes hours, and Check trims it to one build.
      CCACHE_COMPRESSLEVEL: 10
      # clang-tidy-cache skips files whose preprocessed source, flags and
      # resolved clang-tidy config are unchanged. SAVE_OUTPUT/SAVE_ALL store
      # each file's diagnostics (clang-tidy's stdout) and exit code and replay
      # them on a hit; stderr is not replayed. Comments are kept in the hash
      # so that NOLINT edits invalidate the entry.
      CTCACHE_SAVE_OUTPUT: 1
      CTCACHE_SAVE_ALL: 1
      CTCACHE_KEEP_COMMENTS: 1
    steps:
      - name: Setup
        run: |
          echo "NPROCS=$(nproc)" >> $GITHUB_ENV
          # Keyed on the clang-tidy version, which the ctcache hash does not include
          echo "CTCACHE_DIR=${HOME}/.cache/ctcache/$(clang-tidy --version | sha256sum | cut -c1-12)" >> $GITHUB_ENV
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - *install_ccache
      - name: Install ctcache
        run: |
          # ctcache 1.2.0; the module is a self-contained script
          sudo curl -fsSL https://raw.githubusercontent.com/matus-chochlik/ctcache/e33c063ca6e52b48bcefbc45d46d8c150ffa81ca/src/ctcache/clang_tidy_cache.py -o /usr/local/bin/clang-tidy-cache
          sudo chmod +x /usr/local/bin/clang-tidy-cache
      # Restore and save separately: the combined actions/cache saves only
      # when the whole job passes, so a run that finds warnings would throw
      # away the cache it just filled.
      - name: Set Up Ccache
        id: ccache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/ctcache
          key: ccache-${{github.workflow}}-${{github.job}}-${{matrix.enable_eb}}-git-${{github.sha}}-${{github.run_id}}-${{github.run_attempt}}
          restore-keys: |
               ccache-${{github.workflow}}-${{github.job}}-${{matrix.enable_eb}}-git-
      # Debug (-O0): linting does not need optimisation, and clang 18's
      # optimiser crashes (SIGSEGV) on amrex's AMReX_EB_STL_utils.cpp at -O3.
      #
      # -dD: clang-tidy-cache hashes the preprocessed source (-E -C -P), in
      # which a macro definition leaves no trace unless it is used, so a new
      # or changed but unused macro (a bugprone-macro-parentheses case) would
      # hit a stale entry. -dD keeps the #define lines in the -E output and
      # is ignored when compiling, so the build itself is unchanged.
      - name: Configure
        run: |
          cmake -B${{runner.workspace}}/build-clang-tidy \
          -DCMAKE_BUILD_TYPE:STRING=Debug \
          -DCMAKE_CXX_FLAGS:STRING="-dD" \
          -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON \
          -DCMAKE_CXX_COMPILER:STRING=clang++ \
          -DCMAKE_C_COMPILER:STRING=clang \
          -DPELE_ENABLE_EB:BOOL=${{matrix.use_eb}} \
          -DPELE_ENABLE_MPI:BOOL=OFF \
          -DPELE_ENABLE_FCOMPARE_FOR_TESTS:BOOL=OFF \
          -DPELE_ENABLE_CLANG_TIDY:BOOL=ON \
          "-DCLANG_TIDY_EXE:STRING=clang-tidy-cache;$(command -v clang-tidy)" \
          ${{github.workspace}}
      - name: Check
        id: check
        working-directory: ${{runner.workspace}}/build-clang-tidy
        run: |
          mkdir -p ${CTCACHE_DIR}
          # The restored caches carry earlier runs' counts: report this run's
          ccache -z
          clang-tidy-cache --zero-stats || true
          # The file marks the start for find -newer, the time for ccache.
          touch ${{runner.temp}}/cache-start
          start=$(date +%s)
          build_status=0
          cmake --build . --parallel ${{env.NPROCS}} 2>&1 | tee -a clang-tidy-full-report.txt || build_status=$?
          # Hits refresh an entry's mtime: drop the ones this run did not use
          # (and older clang-tidy versions) so the caches do not grow. Only
          # after a complete build: a failed one never reached some files.
          if [ ${build_status} -eq 0 ]; then
            find ${CTCACHE_DIR} -type f ! -newer ${{runner.temp}}/cache-start -delete
            find ${HOME}/.cache/ctcache -mindepth 1 -maxdepth 1 ! -path ${CTCACHE_DIR} -exec rm -rf {} +
            ccache --evict-older-than $(( $(date +%s) - start + 60 ))s
          fi
          # Fail on a failed build: a replayed cache hit restores the exit
          # code but not clang-tidy's stderr, so the warning count alone can
          # miss it.
          exit ${build_status}
      # The reports run when Check found warnings (failed) as well as when
      # it passed, but not after an earlier step failed: there is then no
      # build directory or log, and their errors would bury the real one.
      - name: Ccache Report
        if: ${{ success() || steps.check.outcome == 'failure' }}
        run: |
          du -hs ~/.cache/ccache
          du -hs ~/.cache/ctcache
          # Entries are named by the rest of their sha1 digest (38 hex
          # characters); the per-directory stats files are not counted.
          echo "ctcache entries: $(find ${CTCACHE_DIR} -type f -regextype posix-extended -regex '.*/[0-9a-f]{38}' | wc -l)"
          clang-tidy-cache --show-stats || true
          ccache -s
      # Saved on PRs too (see CCACHE_COMPRESSLEVEL above), whenever Check
      # completed the build, before Short report can fail on warnings.
      - name: Save Ccache
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/ctcache
          key: ${{steps.ccache.outputs.cache-primary-key}}
      # No Full report step: Check already prints the whole log (tee).
      - name: Short report
        if: ${{ success() || steps.check.outcome == 'failure' }}
        working-directory: ${{runner.workspace}}/build-clang-tidy
        run: ${{github.workspace}}/.github/scripts/count_warnings.sh clang-tidy-full-report.txt
  Lint-codeql:
    needs: Formatting
    # No cache to refresh: skipped on the scheduled runs.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          queries: +security-and-quality
          config-file: ./.github/codeql/codeql-config.yml
      - name: Configure
        run: |
          echo "NPROCS=$(nproc)" >> $GITHUB_ENV
          cmake -B${{runner.workspace}}/build-codeql \
          -DCMAKE_BUILD_TYPE:STRING=Debug \
          -DCMAKE_CXX_COMPILER:STRING=clang++ \
          -DCMAKE_C_COMPILER:STRING=clang \
          -DPELE_ENABLE_MPI:BOOL=OFF \
          -DPELE_ENABLE_FCOMPARE_FOR_TESTS:BOOL=OFF \
          -DPELE_ENABLE_CLANG_TIDY:BOOL=OFF \
          ${{github.workspace}}
      - name: Build
        run: |
          cmake --build ${{runner.workspace}}/build-codeql --parallel ${{env.NPROCS}}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:cpp"
          upload: False
          output: sarif-results
      - name: Filter CodeQL sarif
        uses: advanced-security/filter-sarif@v1
        with:
          patterns: |
            -**/Submodules/sundials/**
            -**/Submodules/amrex/**
            -**/Submodules/AMReX-Hydro/**
          input: sarif-results/cpp.sarif
          output: sarif-results/cpp.sarif
      - name: Upload CodeQL sarif
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results/cpp.sarif
  Lint-codespell:
    needs: Formatting
    # No cache to refresh: skipped on the scheduled runs.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Dependencies
        run: |
          # Install Python packages
          pip install codespell
      - name: Run codespell
        run: codespell
