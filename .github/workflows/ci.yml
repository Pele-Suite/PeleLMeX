name: PeleLMeX-CI

on:
  workflow_dispatch:
  push:
    branches: [development]
  pull_request:
    branches: [development]

concurrency:
  group: ${{github.ref}}-${{github.head_ref}}-ci
  cancel-in-progress: true

jobs:
  Formatting:
    runs-on: ubuntu-24.04
    steps:
    - name: Clone
      uses: actions/checkout@v6
    - name: Check formatting
      uses: DoozyX/clang-format-lint-action@v0.20
      with:
        source: './Source ./Exec'
        exclude: '.'
        extensions: 'H,h,cpp'
        clangFormatVersion: 20
  CPU-GNUmake:
    needs: Formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup
        working-directory: ./Exec/RegTests/FlameSheet
        run: |
          echo "NPROCS=$(nproc)" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
          echo "CCACHE_COMPRESSLEVEL=10" >> $GITHUB_ENV
          echo "CCACHE_LOGFILE=${{github.workspace}}/ccache.log.txt" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=100M" >> $GITHUB_ENV
          make COMP=gnu USE_MPI=FALSE DEBUG=TRUE TPL
          make COMP=llvm USE_MPI=FALSE DEBUG=TRUE PRECISION=FLOAT TPL
      - name: Install Ccache
        run: |
          wget https://github.com/ccache/ccache/releases/download/v4.8/ccache-4.8-linux-x86_64.tar.xz
          tar xvf ccache-4.8-linux-x86_64.tar.xz
          sudo cp -f ccache-4.8-linux-x86_64/ccache /usr/local/bin/
      - name: Set Up Ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{github.workflow}}-${{github.job}}-git-${{github.sha}}
          restore-keys: |
               ccache-${{github.workflow}}-${{github.job}}-git-
      - name: FlameSheet debug make
        working-directory: ./Exec/RegTests/FlameSheet
        run: |
          echo "::add-matcher::.github/problem-matchers/gcc.json"
          set -eu -o pipefail
          ccache -z
          make -j ${{env.NPROCS}} DIM=2 KEEP_BUILDINFO_CPP=TRUE USE_CCACHE=TRUE COMP=gnu USE_MPI=FALSE DEBUG=TRUE 2>&1 | tee -a build-output.txt
      - name: FlameSheet ccache report
        working-directory: ./Exec/RegTests/FlameSheet
        run: |
          ccache -s
          du -hs ~/.cache/ccache
      - name: FlameSheet debug test
        working-directory: ./Exec/RegTests/FlameSheet
        run: ./PeleLMeX2d.gnu.DEBUG.drm19.ex flamesheet-drm19-2d.inp amr.max_step=1 amr.plot_int=-1 amr.check_int=-1
      - name: FlameSheet debug report
        working-directory: ./Exec/RegTests/FlameSheet
        run: |
          egrep "Warning:|Error:|warning:|error:" build-output.txt \
            | egrep -v "Submodules/amrex|Submodules/sundials|Submodules/AMReX-Hydro|GNUmakefile|ThirdParty" \
            | egrep -v "ld: warning:" | sort | uniq \
            | awk 'BEGIN{i=0}{print $0}{i++}END{print "Warnings: "i}' > warnings.txt
          cat warnings.txt
          export return=$(tail -n 1 warnings.txt | awk '{print $2}')
          exit ${return}
  CPU-CMake:
    needs: Formatting
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        build_type: [Release, Debug]
        enable_eb: [EB-OFF, EB-ON]
        dim: [2, 3]
        include:
          - os: macos-latest
            install_deps: brew install open-mpi automake ccache
            comp: llvm
            procs: $(sysctl -n hw.ncpu)
            ccache_cache: /Users/runner/Library/Caches/ccache
            reference_comparison: ON
          - os: ubuntu-24.04
            #Note mpich on ubuntu-24.04 does not run mpiexec correctly so we are using openmpi
            install_deps:
              sudo apt-get update
              sudo apt-get install -y libopenmpi-dev openmpi-bin
            comp: gnu
            procs: $(nproc)
            ccache_cache: ~/.cache/ccache
            reference_comparison: OFF
          - build_type: Release
            ctest_args: -LE no-ci
            ccache_size: 250M
          - build_type: Debug
            ctest_args: -LE no-ci
            ccache_size: 500M
          - enable_eb: EB-OFF
            use_eb: "OFF"
          - enable_eb: EB-ON
            use_eb: "ON"
        exclude:
          - os: macos-latest
            build_type: Debug
    env:
      DO_REF_COMPARE: ${{matrix.reference_comparison == 'ON' && github.event_name != 'push'}}
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Setup
        run: |
          echo "NPROCS=${{matrix.procs}}" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
          echo "CCACHE_COMPRESSLEVEL=10" >> $GITHUB_ENV
          echo "CCACHE_LOGFILE=${{github.workspace}}/ccache.log.txt" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=${{matrix.ccache_size}}" >> $GITHUB_ENV
          cmake -E make_directory ${{runner.workspace}}/deps
          if [ "${RUNNER_OS}" != "macOS" ]; then
            ${{github.workspace}}/Submodules/PelePhysics/Submodules/amrex/.github/workflows/dependencies/ubuntu_free_disk_space.sh
          fi
      - name: Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin
          python -m pip install --upgrade pip
          pip install pynose numpy pandas

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install open-mpi automake ccache
          python -m pip install --upgrade pip
          pip install pynose numpy pandas
      - name: Install Ccache
        run: |
          if [ "${RUNNER_OS}" != "macOS" ]; then
            wget https://github.com/ccache/ccache/releases/download/v4.8/ccache-4.8-linux-x86_64.tar.xz
            tar xvf ccache-4.8-linux-x86_64.tar.xz
            sudo cp -f ccache-4.8-linux-x86_64/ccache /usr/local/bin/
          fi
      - name: Set Up Ccache
        uses: actions/cache@v5
        with:
          path: ${{matrix.ccache_cache}}
          key: ccache-${{github.workflow}}-${{github.job}}-${{matrix.os}}-${{matrix.dim}}d-${{matrix.build_type}}-${{matrix.enable_eb}}-git-${{github.sha}}
          restore-keys: |
               ccache-${{github.workflow}}-${{github.job}}-${{matrix.os}}-${{matrix.dim}}d-${{matrix.build_type}}-${{matrix.enable_eb}}-git-
      - name: Configure
        run: |
          cmake -B${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-${{matrix.enable_eb}} \
          -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/install-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-${{matrix.enable_eb}} \
          -DCMAKE_BUILD_TYPE:STRING=${{matrix.build_type}} \
          -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON \
          -DPELE_DIM:STRING=${{matrix.dim}} \
          -DPELE_ENABLE_MPI:BOOL=ON \
          -DMPIEXEC_PREFLAGS:STRING=--oversubscribe \
          -DPELE_ENABLE_EB:BOOL=${{matrix.use_eb}} \
          -DPELE_ENABLE_FCOMPARE_FOR_TESTS:BOOL=OFF \
          -DPELE_SAVE_GOLDS:BOOL=${{matrix.reference_comparison}} \
          -DPELE_SAVED_GOLDS_DIRECTORY=${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-${{matrix.enable_eb}} \
          -DCMAKE_CXX_COMPILER_LAUNCHER:STRING=ccache \
          ${{github.workspace}}
      - name: Build
        run: |
          ccache -z
          cmake --build ${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-${{matrix.enable_eb}} \
            --parallel ${{env.NPROCS}} 2>&1 | tee -a ${{runner.workspace}}/build-output.txt; \
          if [ ${PIPESTATUS[0]} -ne 0 ]; then exit 1; fi \
      - name: Ccache Report
        run: |
          ccache -s
          du -hs ${{matrix.ccache_cache}}
      - name: Report
        run: |
          echo "::add-matcher::.github/problem-matchers/gcc.json"
          egrep "Warning:|Error:|warning:|error:" ${{runner.workspace}}/build-output.txt \
            | egrep -v "Submodules/amrex|Submodules/sundials|Submodules/AMReX-Hydro" \
            | egrep -v "ld: warning:" | egrep -v "lto-wrapper: warning:" | sort | uniq \
            | awk 'BEGIN{i=0}{print $0}{i++}END{print "Warnings: "i}' > ${{runner.workspace}}/build-output-warnings.txt
          cat ${{runner.workspace}}/build-output-warnings.txt
          export return=$(tail -n 1 ${{runner.workspace}}/build-output-warnings.txt | awk '{print $2}')
          exit ${return}
      - name: Test
        run: |
          cd ${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-${{matrix.enable_eb}}; \
          ctest ${{matrix.ctest_args}} -VV --output-on-failure; \
          if [ $? -ne 0 ]; then exit 1; fi \
      - name: Checkout Reference Version
        if: env.DO_REF_COMPARE == 'true'
        run : |
          git remote add amrexcomb https://github.com/Pele-Suite/PeleLMeX.git
          git fetch amrexcomb development --depth=1
          git checkout amrexcomb/development
          git submodule update --recursive --depth=1
      - name: Configure Reference
        if: env.DO_REF_COMPARE == 'true'
        run: |
          cmake -B${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-${{matrix.enable_eb}}-reference \
          -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/install-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-${{matrix.enable_eb}}-reference \
          -DCMAKE_BUILD_TYPE:STRING=${{matrix.build_type}} \
          -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON \
          -DPELE_DIM:STRING=${{matrix.dim}} \
          -DPELE_ENABLE_MPI:BOOL=ON \
          -DMPIEXEC_PREFLAGS:STRING=--oversubscribe \
          -DPELE_ENABLE_FCOMPARE:BOOL=ON \
          -DPELE_ENABLE_FCOMPARE_FOR_TESTS:BOOL=ON \
          -DPELE_REFERENCE_GOLDS_DIRECTORY:STRING=${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-${{matrix.enable_eb}}  \
          -DPELE_ENABLE_EB:BOOL=${{matrix.use_eb}} \
          -DCMAKE_CXX_COMPILER_LAUNCHER:STRING=ccache \
          ${{github.workspace}}
      - name: Build Reference Version
        if: env.DO_REF_COMPARE == 'true'
        run : |
          ccache -z
            cmake --build ${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-${{matrix.enable_eb}}-reference \
            --parallel ${{env.NPROCS}}
          ccache -s
          du -hs ${{matrix.ccache_cache}}
      - name: Test Reference and Compare
        if: env.DO_REF_COMPARE == 'true'
        working-directory: ${{runner.workspace}}/build-${{matrix.dim}}d-${{matrix.os}}-${{matrix.build_type}}-${{matrix.enable_eb}}-reference
        run : |
          ctest ${{matrix.ctest_args}} -VV --output-on-failure
