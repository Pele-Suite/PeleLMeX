name: PeleLMeX-Docs

on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
       - 'Docs/**'
       - '.github/workflows/docs.yml'
  pull_request:
    branches: [development]
    paths:
       - 'Docs/**'
       - '.github/workflows/docs.yml'

jobs:
  Docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Dependencies
        run: |
          pip install sphinx sphinx_rtd_theme
      - name: Configure
        run: cmake -B${{runner.workspace}}/build-docs ${{github.workspace}}/Docs
      # Sphinx runs with -W, so warnings fail the build.
      - name: Build
        run: |
          echo "::add-matcher::${{github.workspace}}/.github/problem-matchers/sphinx.json"
          cmake --build ${{runner.workspace}}/build-docs
          touch ${{runner.workspace}}/build-docs/html/manual/html/.nojekyll
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: ${{runner.workspace}}/build-docs/html
          single-commit: true
