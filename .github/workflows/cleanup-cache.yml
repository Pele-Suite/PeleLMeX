name: CleanUpCache

on:
  workflow_run:
    workflows: [PeleLMeX-CI]
    types:
      - completed

jobs:
  CleanUpCcacheCache:
    name: Clean Up Ccache Cache for ${{ github.event.workflow_run.name }}
    # Only development saves caches (SAVE_CCACHE in ci.yml), so only its runs
    # leave old ones to delete. A fork's development branch is not this one.
    if: >-
      github.event.workflow_run.head_branch == 'development' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # gh reads the repository from here, so no checkout is needed.
      GH_REPO: ${{ github.repository }}
      BRANCH: refs/heads/development
      # Triggering workflow run name (e.g., PeleLMeX-CI)
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
    steps:
      - name: Clean up ccache
        run: |
          # Setting this to not fail the workflow while deleting cache keys.
          set +e

          # In our cache keys, the substring after `-git-` is the git hash, run
          # id and attempt (so a manual run on an unchanged commit, or a re-run,
          # can save); the substring before it is a unique id for jobs
          # (e.g., `ccache-PeleLMeX-CI-CPU-GNUmake`).
          # The goal is to keep the newest key of each job and delete all others.

          # something like ccache-PeleLMeX-CI-
          keyprefix="ccache-${WORKFLOW_NAME}-"

          cached_jobs=$(gh cache list -L 100 --ref $BRANCH --key "$keyprefix" --json key --jq '.[].key' | awk -F '-git-' '{print $1}' | sort -u)

          # cached_jobs is something like "ccache-PeleLMeX-CI-CPU-CMake-ubuntu-24.04-2d-Release-EB-OFF ccache-PeleLMeX-CI-CPU-GNUmake".
          for j in $cached_jobs
          do
            # Delete all entries except the most recently created one. Not the
            # most recently used: PRs restore development's cache, so one that
            # restores the old key while this run's other jobs are still going
            # would otherwise make the old key win over the new one. Note that
            # `gh cache delete` has no ref filter, so we delete by cache id.
            old_ids=$(gh cache list -L 100 --ref $BRANCH --key "${j}-git-" --sort created_at --order desc --json id --jq '.[].id' | tail -n +2)
            for i in $old_ids
            do
              gh cache delete "$i" || true
            done
          done
