name: CleanUpCache

on:
  workflow_run:
    workflows: [PeleLMeX-CI]
    types:
      - completed

jobs:
  CleanUpCcacheCache:
    name: Clean Up Ccache Cache for ${{ github.event.workflow_run.name }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # gh reads the repository from here, so no checkout is needed.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Clean up ccache
        # Event values go through the environment, not ${{ }} in the script:
        # a branch name is chosen by whoever pushed it (forks included), and
        # pasted into the script it could run shell commands.
        env:
          # push or pull_request or schedule or ...
          EVENT: ${{ github.event.workflow_run.event }}
          # Triggering workflow run name (e.g., PeleLMeX-CI)
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          pr_number: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          # For debugging, cat ${GITHUB_EVENT_PATH} to see the payload.

          if [[ $EVENT == "pull_request" ]]; then
            # The run's own PR when it has one (same-repo PRs); otherwise search,
            # keeping only the PR whose head is this commit (a stacked PR also
            # contains it). Closed PRs too: one can close before this runs.
            if [ -z "${pr_number}" ]; then
              pr_number=$(gh pr list --state all --search "${HEAD_SHA}" --json number,headRefOid \
                --jq "map(select(.headRefOid == \"${HEAD_SHA}\")) | .[0].number // empty") || true
            fi
            if [ -z "${pr_number}" ]; then
              echo "No PR for ${HEAD_SHA}; nothing to clean up."
              exit 0
            fi
            echo "Clean up cache for PR ${pr_number}"
            BRANCH=refs/pull/${pr_number}/merge
          else
            BRANCH="refs/heads/${HEAD_BRANCH}"
            # The branch's current commit (empty if the lookup fails).
            tip=$(gh api "repos/${GH_REPO}/commits/${HEAD_BRANCH}" --jq .sha 2>/dev/null) || tip=
          fi

          # Setting this to not fail the workflow while deleting cache keys.
          set +e

          # In our cache keys, the substring after `-git-` is the git hash, run
          # id and attempt (so a scheduled run on an unchanged commit, or a
          # re-run, can save); the substring before it is a unique id for jobs
          # (e.g., `ccache-PeleLMeX-CI-CPU-GNUmake`).
          # The goal is to keep one key per job: the newest built from the
          # branch's current commit, else the newest. A scheduled run (its own
          # concurrency group) can overlap a push run and save after it, so the
          # newest may be from an older commit.

          # something like ccache-PeleLMeX-CI-
          keyprefix="ccache-${WORKFLOW_NAME}-"

          cached_jobs=$(gh cache list -L 100 --ref $BRANCH --key "$keyprefix" --json key --jq '.[].key' | awk -F '-git-' '{print $1}' | sort -u)

          # cached_jobs is something like "ccache-PeleLMeX-CI-CPU-CMake-ubuntu-24.04-2d-Release-EB-OFF ccache-PeleLMeX-CI-CPU-GNUmake".
          for j in $cached_jobs
          do
            # Newest by creation, not by use: PRs restore development's cache,
            # so one that restores the old key while this run's other jobs are
            # still going would otherwise make the old key win over the new
            # one. `gh cache delete` has no ref filter, so we delete by id.
            # (tip is a hex SHA or empty, so safe inside the jq string.)
            old_ids=$(gh cache list -L 100 --ref $BRANCH --key "${j}-git-" --sort created_at --order desc --json id,key \
              --jq "(map(select(.key | contains(\"-git-${tip:-none}-\")))[0] // .[0]).id as \$k | .[] | select(.id != \$k) | .id")
            for i in $old_ids
            do
              gh cache delete "$i" || true
            done
          done
